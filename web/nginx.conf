server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Using a variable in proxy_pass (rather
    # than a bare upstream name) makes nginx resolve "api" lazily per-request
    # instead of once at config load, so it doesn't fail to start if the api
    # container isn't up yet and doesn't cache a stale IP across api restarts.
    resolver 127.0.0.11 valid=30s;

    location = /health {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No path is appended after $api_upstream, so nginx forwards the
    # original request URI (including the /api/... prefix) unchanged —
    # matching Express's routes, which already expect that prefix.
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # SPA route refresh support: unknown paths fall back to index.html so
    # client-side routing (React Router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
