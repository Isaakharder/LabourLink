<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="/manifest.json" />
    <title>LabourLink</title>
    <!-- Inline so the loading screen (and boot-guard.js's error screen)
         paint before the app bundle or its stylesheet has loaded. -->
    <style>
      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        color: #111827;
        background: #ffffff;
      }
      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #dbeafe;
        border-top-color: #1d4ed8;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .boot-text {
        font-size: 16px;
        color: #374151;
        margin: 0;
      }
      .boot-retry {
        min-width: 160px;
        padding: 14px 24px;
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
        background: #1d4ed8;
        border: none;
        border-radius: 10px;
      }
      .boot-code {
        font-size: 13px;
        color: #6b7280;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status">
        <div class="boot-spinner"></div>
        <p class="boot-text">Loading LabourLink…</p>
      </div>
    </div>
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
