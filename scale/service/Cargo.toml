[package]
name = "labourlink-scaled"
version = "0.2.0"
edition = "2021"
description = "LabourLink Scale background service: serial RFID + scale indicator, weighing state machine, SQLite outbox"
publish = false

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No libudev: ports are configured by path (/dev/labourlink/*), and
# list-ports falls back to scanning /dev/serial/by-id.
serialport = { version = "4", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
