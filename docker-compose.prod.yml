# Local-network production stack for the dedicated greenhouse computer.
#
# Usage (see docs/DEPLOYMENT.md for the full walkthrough):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only the web service publishes a port. Postgres and the API stay on the
# internal Docker network and are never reachable from the LAN directly.
services:
  postgres:
    image: postgres:16-alpine
    container_name: labourlink_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labourlink}
      POSTGRES_USER: ${POSTGRES_USER:-labourlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production — see .env.production.example}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - ${BACKUP_DIR:-C:/LabourLinkBackups}:/backups
    networks:
      - labourlink_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-labourlink}']
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published — Postgres is only reachable from other containers
    # on labourlink_network, never from the LAN.

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    container_name: labourlink_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-labourlink}
      DB_USER: ${POSTGRES_USER:-labourlink}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production — see .env.production.example}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production — see .env.production.example}
      # Cookie Secure flag is intentionally independent of NODE_ENV — plain
      # LAN HTTP has no TLS, so Secure cookies would silently break login.
      # Flip to "true" only once a reverse proxy terminates real HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - labourlink_network
    # No ports published — the API is only reachable through the web
    # (nginx) container's reverse proxy, never directly from the LAN.

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: prod
    container_name: labourlink_web_prod
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - labourlink_network

volumes:
  postgres_data_prod:
    name: labourlink_postgres_data_prod

networks:
  labourlink_network:
    driver: bridge
